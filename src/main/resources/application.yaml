spring:
  application:
    name: user-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  cache:
    type: redis
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-256-bits-long-12345}